spring.application.name=ms-pedidos-ventas
server.port=8086

spring.datasource.url=${VENTAS_DB_URL:jdbc:mysql://localhost:3306/bd_ventas?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
# Cambiar la ruta del JSON con la especificacion OpenAPI (Por defecto: /v3/api-docs)
springdoc.api-docs.path=/api-docs

# Ordenar los endpoints alfabeticamente en la UI
springdoc.swagger-ui.operationsSorter=alpha


# URLs de microservicios relacionados (comunicacion REST inter-MS)
ms.catalogo.url=http://localhost:8084
ms.inventario.url=http://localhost:8085
ms.logistica.url=http://localhost:8087

ms.usuarios.url=http://localhost:8083

# Configuración de Seguridad JWT HS256
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=2

