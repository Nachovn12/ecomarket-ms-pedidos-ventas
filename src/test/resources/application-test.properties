spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# URLs de MS externos (necesarias para que *ClientService carguen en el contexto Spring)
ms.catalogo.url=http://localhost:8084
ms.inventario.url=http://localhost:8085
ms.logistica.url=http://localhost:8087
ms.usuarios.url=http://localhost:8083

# Clave secreta fija EXCLUSIVA para pruebas automatizadas (H2/Unit Tests) - NUNCA en producción
jwt.secret=EcoMarketSpATestSecretKeyHS256ForAutomatedTestsOnly2026x9876543210
jwt.expiration-hours=2